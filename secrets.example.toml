# Example secrets for contributors — this file IS committed; real keys never are.
#
# 1. Copy it:  cp secrets.example.toml secrets.toml      (Windows: copy secrets.example.toml secrets.toml)
# 2. Fill in your own credentials. secrets.toml is git-ignored.
#
# Environment variables override file values, e.g. ELEVENLABS_API_KEY, TWILIO_API_KEY_SID.

[elevenlabs]
api_key = "sk-your-elevenlabs-key"

[cerebras]
api_key = "csk-your-cerebras-key"

[twilio]
api_key_sid = "SK-your-twilio-api-key-sid"      # SK... = API Key SID
api_key_secret = "your-twilio-api-key-secret"
# account_sid = "ACyour-account-sid"            # AC... = Account SID, needed to place calls
# from_number = "+15550001234"                  # our dedicated caller ID (E.164), needed to place calls
# allowed_numbers = ["+15550001234"]            # E.164 destinations this bot may dial (allowlist);
#                                               # keep real numbers out of committed files. Env override:
#                                               # TWILIO_ALLOWED_NUMBERS="+15550001234,+15550005678"
# live_test_number = "+15550001234"             # default destination for live tests; must be one of
#                                               # allowed_numbers. Env override: TWILIO_LIVE_TEST_NUMBER

[github]
api_key = "ghp-your-github-token"

# STT provider selection (DESIGN.md §3.4): "deepgram" (primary) or "scribe"
# (fallback — ElevenLabs Scribe v2 Realtime, billed from the [elevenlabs]
# credit pool at 330 credits/min). Env override: STT_PROVIDER.
[stt]
provider = "deepgram"

# Primary STT (DESIGN.md §3.4). Env override: DEEPGRAM_API_KEY.
[deepgram]
api_key = "your-deepgram-key"
