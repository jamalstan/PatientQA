[project]
name = "patientqa"
version = "0.1.0"
description = "Synthetic-patient voice bot that stress-tests Pretty Good AI's medical scheduling line"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "elevenlabs>=2.64.0",
    "lameenc>=1.8.4",
    "openai>=3.2.0",
    "pydantic>=2.13.4",
    # tomllib is stdlib from 3.11; tomli backports it for 3.10
    "tomli>=2.0.1; python_version < '3.11'",
    "twilio>=9.11.0",
    "websockets>=15",
]

[project.scripts]
patientqa = "patientqa.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patientqa"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# embeds the DESIGN.md §6.3 manifest example verbatim as a fixture
"tests/datagen/test_schemas.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
